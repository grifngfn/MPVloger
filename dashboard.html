<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MPVloger · Watch history · build 11-26g</title>
<script>
/* Looks: <html data-look="id">. Set here, before the first paint, so there is no flash of the default look. */
(function(){var d=document.documentElement,l="violet";
try{l=localStorage.getItem("mpvloger.look")||l}catch(e){}
if(!/^[a-z0-9-]{1,32}$/.test(l))l="violet";
window.applyLook=function(x){d.dataset.look=x;if(x==="violet")delete d.dataset.plain;else d.dataset.plain="1"};
applyLook(l)})();
</script>
<style>
:root{--bg:#f2f2f8;--card:#fff;--card2:#ececf4;--text:#17171f;--mute:#707084;--line:#dedeea;--accent:#6d5efc;--accent2:#c06cff;--ok:#16a34a;--warn:#f59e0b;--bar:rgba(242,242,248,.78);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a0a10;--card:#14141d;--card2:#1d1d29;--text:#f0f0f7;--mute:#9a9ab0;--line:#262636;--accent:#8b7dff;--accent2:#ff7ad9;--ok:#4ade80;--bar:rgba(10,10,16,.75);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0a0a10;--card:#14141d;--card2:#1d1d29;--text:#f0f0f7;--mute:#9a9ab0;--line:#262636;--accent:#8b7dff;--accent2:#ff7ad9;--ok:#4ade80;--bar:rgba(10,10,16,.75);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*{box-sizing:border-box}
body{margin:0;background-color:var(--bg);background-image:radial-gradient(700px 420px at 8% -80px,color-mix(in srgb,var(--accent) 26%,transparent),transparent),radial-gradient(700px 420px at 95% -120px,color-mix(in srgb,var(--accent2) 20%,transparent),transparent);background-repeat:no-repeat;color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bar);backdrop-filter:blur(16px)}
main{max-width:1180px;margin:0 auto;padding:26px 18px 70px}
h1{font-size:2.3rem;letter-spacing:-.03em;margin:0;background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
h2{font-size:1.15rem;margin:30px 0 12px;letter-spacing:-.01em}
h3{margin:0 0 12px;font-size:.78rem;text-transform:uppercase;letter-spacing:.09em;color:var(--mute)}
.mute,small{color:var(--mute)}
button,select,input{font:inherit;color:var(--text)}
button{cursor:pointer}
.chip,select,input{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:7px 14px;transition:border-color .2s,background .2s,transform .15s}
.chip:hover,select:hover,input:hover{border-color:var(--accent)}
.chip:active{transform:scale(.96)}
.chip.on{background:linear-gradient(90deg,var(--accent),var(--accent2));border-color:transparent;color:#fff}
input[type=date]{padding:6px 10px}
#drop{display:grid;place-items:center;gap:6px;text-align:center;margin-top:30px;padding:70px 20px;border:2px dashed var(--line);border-radius:26px;background:var(--card);cursor:pointer;transition:.25s}
#drop:hover,body.drag #drop{border-color:var(--accent);transform:translateY(-3px)}
#drop b{font-size:1.2rem}
.panel,.tile{background:color-mix(in srgb,var(--card) 78%,transparent);border:1px solid var(--line);border-radius:20px;backdrop-filter:blur(10px)}
.panel{padding:16px 18px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:20px 0 14px}
.tile{padding:14px 16px;transition:transform .25s,border-color .25s}
.tile:hover{transform:translateY(-3px);border-color:var(--accent)}
.tile b{display:block;font-size:1.55rem;letter-spacing:-.02em;line-height:1.15}
.tile small{display:block}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:12px}
.bars{display:flex;align-items:flex-end;gap:3px;height:140px}
.col{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:5px;min-width:0}
.col i{display:block;width:100%;border-radius:6px 6px 2px 2px;background:linear-gradient(var(--accent2),var(--accent));transform-origin:bottom;animation:grow .7s cubic-bezier(.2,.8,.2,1) both;transition:filter .2s}
.col:hover i{filter:brightness(1.25)}
.col.on i{outline:2px solid var(--text);outline-offset:1px}
.col small{font-size:.65rem;height:.9rem;white-space:nowrap}
@keyframes grow{from{transform:scaleY(0)}}
.row{display:grid;grid-template-columns:minmax(0,1.2fr) 2fr auto;gap:10px;align-items:center;padding:5px 0}
.row span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.track,.prog{height:7px;border-radius:9px;background:var(--card2);overflow:hidden}
.track i,.prog i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--accent),var(--accent2));animation:fill .8s cubic-bezier(.2,.8,.2,1) both;transform-origin:left}
@keyframes fill{from{transform:scaleX(0)}}
.rail{display:flex;gap:12px;overflow-x:auto;padding:4px 2px 12px;scroll-snap-type:x proximity}
.cont{flex:none;width:290px;display:flex;gap:12px;align-items:center;padding:10px;scroll-snap-align:start;cursor:pointer;transition:transform .25s,border-color .25s}
.cont:hover{transform:translateY(-3px);border-color:var(--accent)}
.cont .cov{width:50px;height:72px}
.cont b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:190px}
.next{color:var(--accent);font-weight:650;font-size:.86rem}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:8;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 0;background:var(--bar);backdrop-filter:blur(16px)}
.bar input[type=search]{flex:1 1 200px}
.lib{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
.poster{position:relative;aspect-ratio:2/3;border-radius:18px;overflow:hidden;cursor:pointer;border:1px solid var(--line);transition:transform .3s cubic-bezier(.2,.8,.2,1),box-shadow .3s}
.poster:hover{transform:translateY(-6px) scale(1.02);box-shadow:0 18px 40px -16px var(--accent)}
.poster .cov{position:absolute;inset:0;width:auto;height:auto;border-radius:0;font-size:2.2rem}
.ov{position:absolute;inset:auto 0 0;padding:40px 12px 12px;background:linear-gradient(transparent,#000d);color:#fff;display:grid;gap:3px}
.ov b{font-size:.95rem;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ov small{color:#ffffffbb}
.ov .prog{background:#ffffff30;height:4px}
.badge{position:absolute;top:10px;right:10px;padding:2px 9px;border-radius:999px;background:#000a;color:#fff;font-size:.75rem;backdrop-filter:blur(6px)}
.anim .poster{animation:rise .55s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i)*25ms)}
@keyframes rise{from{opacity:0;transform:translateY(18px)}}
.cov{flex:none;width:58px;height:84px;border-radius:12px;display:grid;place-items:center;font-weight:700;color:#fff;background:linear-gradient(145deg,hsl(var(--h) 60% 50%),hsl(calc(var(--h) + 45) 60% 30%)) center/cover no-repeat}
.cov.img{color:transparent}
#veil{position:fixed;inset:0;background:#0009;opacity:0;pointer-events:none;transition:opacity .3s;z-index:20}
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);z-index:30;background:var(--card);border-left:1px solid var(--line);transform:translateX(105%);transition:transform .42s cubic-bezier(.2,.8,.2,1);overflow:auto;padding:calc(20px + env(safe-area-inset-top,0px)) 20px 30px}
.show #veil{opacity:1;pointer-events:auto}.show #drawer{transform:none}
#x{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:14px;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--card2);font-size:1.3rem;line-height:1}
.dh{display:flex;gap:14px;align-items:center;margin-bottom:14px;padding-right:40px}
.dh .cov{width:80px;height:116px}
.dh h4{margin:0 0 4px;font-size:1.3rem;letter-spacing:-.02em}
ul{list-style:none;margin:0;padding:0}
li{display:grid;grid-template-columns:4.8rem 1fr 4.5rem 2.6rem;align-items:center;gap:2px 10px;padding:10px 0;border-top:1px solid var(--line)}
.pill{justify-self:start;padding:2px 10px;border-radius:999px;background:var(--card2);font-weight:650;font-size:.8rem}
.pc{text-align:right;font-size:.85rem}.ok{color:var(--ok);font-weight:700}
.miss{margin:0 0 12px;font-size:.9rem}
li small{grid-column:1/-1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{grid-column:1/-1;text-align:center;padding:40px 0}
#drop.mini{margin:8px 0 0;padding:6px 16px;display:inline-flex;border-width:1px;border-radius:999px;transform:none}
#drop.mini span{display:none}#drop.mini b{font-size:.9rem;font-weight:600}
details>summary{cursor:pointer}
.tabs{display:inline-flex;gap:4px;padding:4px;margin-top:16px;border:1px solid var(--line);border-radius:999px;background:var(--card)}
.tabs button{border:0;background:none;padding:8px 22px;border-radius:999px;transition:background .25s,color .25s}
.tabs button:hover{background:var(--card2)}
.tabs .on{background:linear-gradient(90deg,var(--accent),var(--accent2));color:#fff}
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:16px}.tools .tabs{margin-top:0}
.rr{display:grid;grid-template-columns:9.5rem 1fr 8rem 12rem;gap:8px;padding:7px 0;border-top:1px solid var(--line);font-size:.85rem}
.rr span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.st{position:absolute;top:10px;left:10px;padding:2px 9px;border-radius:999px;background:linear-gradient(90deg,var(--accent),var(--accent2));color:#fff;font-size:.72rem}
.edit{margin:0 0 14px;border:1px solid var(--line);border-radius:14px;padding:10px 14px;background:var(--card2)}
.edit label{display:grid;gap:4px;margin:10px 0;color:var(--mute);font-size:.85rem}
.edit input,.edit select,.edit textarea{width:100%;border-radius:12px;font:inherit}
.edit textarea{background:var(--card);border:1px solid var(--line);color:var(--text);padding:8px 12px;resize:vertical}
.erow{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.note{margin:0 0 12px;padding:8px 12px;border-left:3px solid var(--accent);color:var(--mute);white-space:pre-wrap}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}

/* ===================== LOOKS =====================
   A look is chosen with <html data-look="id"> (the select#look in the header; "violet" is the original design).
   Every look except violet is also "plain" (<html data-plain>): no blur, no animations, no gradient backdrop.
   That is done once, below, so a new look cannot slow the page down.

   To add a look:
     1. Add <option value="id">Look · Name</option> to select#look in the header.
     2. Add a block like the two below: a palette (the variables) and, if you want, a few overrides.
        Keep every rule under html[data-look="id"] so it can never touch the other looks.
   Variables: --bg --card --card2 --text --mute --line --accent --accent2 --ok --warn
              --bar (solid colour of the sticky bars) --on-accent (text colour on top of --accent)
   Layout hooks: .lib (library grid)  .poster (one show)  .cov (cover)  .ov (title and progress)  .badge  .st  .panel  .tile */
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}

/* shared by every look except violet */
html[data-plain] body{background-image:none}
html[data-plain] body::before{backdrop-filter:none}
html[data-plain] :is(.bar,.panel,.tile,.badge){backdrop-filter:none}
html[data-plain] :is(.panel,.tile){background:var(--card)}
html[data-plain] .bar{background:var(--bar)}
html[data-plain] :is(.col i,.track i,.prog i,.anim .poster){animation:none}
html[data-plain] :is(.chip.on,.tabs .on,.st){background:var(--accent);color:var(--on-accent,#fff)}
html[data-plain] h1{background:none;color:var(--accent)}
html[data-plain] .poster:hover{box-shadow:none}

/* ---- Paper: warm light, serif headings, flat catalogue cards (title under the cover) ---- */
html:root[data-look="paper"]{--bg:#f6f1e7;--card:#fffdf8;--card2:#efe7d6;--text:#2b2620;--mute:#7a6f5f;--line:#ddd1ba;--accent:#b4572a;--accent2:#d98e3f;--ok:#4d7c3a;--warn:#c2810c;--bar:#f6f1e7;--on-accent:#fff;--serif:Georgia,"Iowan Old Style","Palatino Linotype",Palatino,"Times New Roman",serif;color-scheme:light}
html[data-look="paper"] h1{color:var(--text)}
html[data-look="paper"] :is(h1,h2,.tile b,.dh h4){font-family:var(--serif)}
html[data-look="paper"] :is(.panel,.tile,.chip,select,input,#drop){border-radius:6px}
html[data-look="paper"] .poster{aspect-ratio:auto;display:flex;flex-direction:column;border-radius:6px;background:var(--card)}
html[data-look="paper"] .poster .cov{position:static;width:100%;height:auto;aspect-ratio:2/3;border-radius:0}
html[data-look="paper"] .ov{position:static;background:none;color:var(--text);padding:10px 12px 12px}
html[data-look="paper"] .ov small{color:var(--mute)}
html[data-look="paper"] .ov .prog{background:var(--card2)}

/* ---- Terminal: dark, monospace, compact list instead of the poster grid ---- */
html:root[data-look="terminal"]{--bg:#0b0f0c;--card:#111813;--card2:#18221b;--text:#d7f5df;--mute:#6f9a7d;--line:#1f3326;--accent:#39d98a;--accent2:#f5c542;--ok:#39d98a;--warn:#f5c542;--bar:#0b0f0c;--on-accent:#04120a;--mono:ui-monospace,"SF Mono","JetBrains Mono","DejaVu Sans Mono",Menlo,Consolas,monospace;color-scheme:dark}
html[data-look="terminal"] body{font-family:var(--mono);font-size:14px}
html[data-look="terminal"] h1::before{content:"$ ";color:var(--mute)}
html[data-look="terminal"] :is(h1,.tile b){letter-spacing:0}
html[data-look="terminal"] :is(.panel,.tile,.chip,select,input,#drop){border-radius:3px}
html[data-look="terminal"] .lib{grid-template-columns:1fr;gap:0;border-top:1px solid var(--line)}
html[data-look="terminal"] .poster{aspect-ratio:auto;display:grid;grid-template-columns:40px minmax(0,1fr) auto;grid-template-areas:"c o b" "c o s";column-gap:12px;align-items:center;padding:6px 8px;border:0;border-bottom:1px solid var(--line);border-radius:0;overflow:visible}
html[data-look="terminal"] .poster:hover{transform:none;background:var(--card2)}
html[data-look="terminal"] .poster .cov{grid-area:c;position:static;width:40px;height:56px;border-radius:3px;font-size:.9rem}
html[data-look="terminal"] .ov{grid-area:o;position:static;background:none;color:var(--text);padding:0}
html[data-look="terminal"] .ov small{color:var(--mute)}
html[data-look="terminal"] .ov b{-webkit-line-clamp:1}
html[data-look="terminal"] .ov .prog{background:var(--card2);height:3px}
html[data-look="terminal"] .badge{grid-area:b;position:static;justify-self:end;padding:0;background:none;color:var(--accent);font-size:.85rem}
html[data-look="terminal"] .st{grid-area:s;position:static;justify-self:end;font-size:.7rem}
</style>
</head>
<body>
<main>
<div class="top"><div><h1>MPVloger</h1>
<p class="mute" style="margin:2px 0 0;font-weight:600">Watch history</p></div>
<select id="look" aria-label="Look" title="Change the look of the page"><option value="violet">Look · Violet</option><option value="paper">Look · Paper</option><option value="terminal">Look · Terminal</option></select></div>
<p id="msg" class="mute">Your log is read and shown in this browser only; nothing is uploaded.</p>
<p id="err" hidden style="color:#ef4444;font-weight:600"></p>
<p id="dbnote" hidden class="mute" style="font-weight:600"></p>
<div id="donenote" class="panel" hidden style="margin:10px 0;padding:10px 14px"></div>
<label id="drop"><b>Choose watch-history.jsonl</b><span class="mute">or drop it anywhere on this page</span><input id="file" type="file" accept=".jsonl,.json,.txt" hidden></label>
<div id="app" hidden>
<div class="tools">
<div class="tabs"><button id="tabS" data-tab="series" class="on">Series</button><button id="tabM" data-tab="movies">Movies</button><button data-tab="info">Info</button></div>
<div class="tabs" title="How watch time is counted"><button data-mode="played" class="on">Reported playtime</button><button data-mode="runtime">Video runtime</button><button data-mode="open">Open→close</button></div>
<button class="chip on" id="mrg" title="Merge records of the same file opened within 3 seconds of each other">Merge double launches</button>
<button class="chip" id="exp1">Export library CSV</button><button class="chip" id="exp2">Export sessions CSV</button><button class="chip" id="lp" title="Fetch posters from AniList / MyAnimeList (sends show titles to those sites)">Load posters</button><button class="chip" id="refresh" hidden title="Sync new sessions from the log">Refresh</button>
</div>
<div id="dash">
<section id="stats" class="stats"></section>
<section class="g2">
<div class="panel"><h3>Last 30 days · click a bar to filter</h3><div id="daily" class="bars"></div></div>
<div class="panel"><h3>Top titles by time</h3><div id="top"></div></div>
<div class="panel"><h3>Time of day</h3><div id="hours" class="bars"></div></div>
<div class="panel"><h3>Weekdays</h3><div id="wk" class="bars"></div></div>
</section>
<div id="contwrap"><h2>Continue watching</h2><div id="cont" class="rail"></div></div>
<h2>Library</h2>
<div class="bar">
<input id="q" autocomplete="off" type="search" placeholder="Search titles…">
<button class="chip" data-r="1">Today</button><button class="chip" data-r="7">7 days</button><button class="chip" data-r="30">30 days</button><button class="chip on" data-r="0">All</button>
<input id="from" autocomplete="off" type="date" title="From"><input id="to" autocomplete="off" type="date" title="To">
<select id="sort" autocomplete="off"><option value="last">Recent</option><option value="secs">Most time</option><option value="title">A–Z</option></select>
<select id="min" autocomplete="off"><option value="0">Show all opens</option><option value="30" selected>Hide under 30 s</option><option value="300">Hide under 5 min</option><option value="600">Hide under 10 min</option></select>
<select id="prog" autocomplete="off"><option value="all">Any progress</option><option value="done">Finished</option><option value="part">Not finished</option></select><select id="kindf" autocomplete="off"><option value="all">Any type</option><option value="anime">Anime</option><option value="kdrama">K-drama</option><option value="cdrama">C-drama</option><option value="jdrama">J-drama</option><option value="western">Western TV</option><option value="other">Other</option><option value="none">No type</option></select><label class="mute" style="white-space:nowrap" title="Count episodes marked as watched outside mpv in time totals and the calendar (the show needs a date)"><input type="checkbox" id="mantog"> manual in stats</label><label class="mute" style="white-space:nowrap" title="When every episode is finished, offer to set the show to Completed"><input type="checkbox" id="autotog"> suggest Completed</label><small id="hid" class="mute"></small><button class="chip" id="clr" hidden>Clear filters ✕</button>
</div>
<div id="list" class="lib" style="margin-top:12px"></div>
</div>
<section id="info" class="panel" style="margin-top:18px" hidden><div id="infoBody"></div><div id="typesBox"></div></section>
</div>
</main>
<div id="veil"></div>
<aside id="drawer"><button id="x" aria-label="Close">×</button><div id="dbody"></div></aside>
<script>
const $=id=>document.getElementById(id);
// Show any script error on the page instead of failing silently.
const showErr=m=>{const b=$("err");b.hidden=false;b.textContent="Script error: "+m};
addEventListener("error",e=>showErr(e.message+" (line "+e.lineno+")"));
addEventListener("unhandledrejection",e=>showErr(String(e.reason&&e.reason.message||e.reason)));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const dur=s=>{if(s<60)return Math.round(s)+"s";const h=Math.floor(s/3600),m=Math.floor(s%3600/60);return h?`${h}h ${pad(m)}m`:`${m}m`};
const hue=s=>{let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))%360;return h};
const initials=t=>t.split(/\s+/).filter(Boolean).slice(0,2).map(w=>[...w][0].toUpperCase()).join("");
const lab=(s,e)=>e==null?"Movie":(s!=null?`S${pad(s)}`:"")+`E${pad(e)}`;
let sessions=[],G=new Map(),tab="series",INFO={},showInfo=false,postersOn=false,whyFn=null;
let EDITS={version:1,shows:{}},SERVER=false,SERVERINFO={},drawerId="",FIN=new Map();
let SYNC={},DBROWS=[],DBLAST=0,DBEPOCH=null; // server mode: sessions kept in memory, only new ones are fetched
const STATUS={watching:"Watching",completed:"Completed",hold:"On hold",dropped:"Dropped",plan:"Plan to watch"};
const KINDS={anime:"Anime",kdrama:"K-drama",cdrama:"C-drama",jdrama:"J-drama",western:"Western TV",other:"Other"};
const totalOf=k=>{const t=EDITS.shows[k]?.total;return Number.isFinite(t)&&t>0?t:null};

/* Episodes marked as watched outside mpv. Stored per show as edits.manual = {"<season>":[eps]} ("0" = no season).
   Ids look like "season:ep" (same format as FIN). */
const manualOf=k=>{
  const m=EDITS.shows[k]?.manual,out=new Set();
  if(m&&typeof m==="object")for(const s in m)if(Array.isArray(m[s]))for(const e of m[s])if(Number.isInteger(e))out.add((+s)+":"+e);
  return out;
};
// Season most of this show's real sessions use (0 = none); plain numbers typed in the edit box go here.
function defSeason(k){
  const c=new Map();
  for(const s of sessions)if(s.key===k&&s.ep!=null){const v=s.season??0;c.set(v,(c.get(v)||0)+1)}

function parseName(fn){

  s=s.replace(/\[[^\]]*\]/g," ").replace(/\(([^)]*)\)/g,(m,x)=>/^(19|20)\d\d$/.test(x)?m:" ").replace(/\s+/g," ").trim();
  s=/\s/.test(s)?s.replace(/_/g," "):s.replace(/[._]/g," ");

  if(m=s.match(/^(.*?)[\s.-]*\bS(\d{1,2})\s?E(\d{1,4})\b/i)){title=m[1];season=+m[2];ep=+m[3]}
  else if(m=s.match(/^(.*?)[\s.-]*\b(\d{1,2})x(\d{2,3})\b/i)){title=m[1];season=+m[2];ep=+m[3]}
  else if(m=s.match(/^(.*?)[\s.-]*\b(?:episode|ep\.?|e)\s?(\d{1,4})\b/i)){title=m[1];ep=+m[2]}
  else if(m=s.match(/^(.*?)\s-\s(\d{1,4})(?:v\d)?(?:\s|$)/)){title=m[1];ep=+m[2]}
  else title=s.replace(/\b(480p|720p|1080p|2160p|4k|x26[45]|h\.?26[45]|hevc|blu-?ray|bdrip|web-?dl|webrip|hdtv|dvdrip)\b.*$/i,"");
  title=title.replace(/\b(?:season|s)\s?(\d{1,2})$/i,(a,x)=>{if(season==null)season=+x;return ""});
  title=title.replace(/[\s._-]+$/,"").replace(/\s+/g," ").trim()||s||fn;
  return {title,season,ep,key:title.toLowerCase().replace(/[^\p{L}\p{N}]+/gu,"")||fn};
}

/* Use the folder name (logged since the newer script) to fill gaps the filename leaves. */
const GENERIC=/^(videos?|downloads?|anime|movies?|tv|shows?|series|media|specials?|home|desktop|temp)$/i;

// A result only counts if most words of our title appear in one of its titles (avoids wrong posters).
const STOP=new Set(["and","the","of","to","no","wa","ga","a","in"]);

const variants=t=>[...new Set([t,t.replace(/[-_]/g," "),t.split(/\s+(?:and|the|no|to|of)\s+|:\s*|\s-\s/i)[0]].map(v=>v.trim()).filter(v=>v.length>=3))];

async function fetchCover(t){
  let err="";
  for(const v of variants(t)){
    try{
      const r=await fetch("https://graphql.anilist.co",{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({query:"query($s:String){Page(perPage:5){media(search:$s,type:ANIME){coverImage{large} title{romaji english native} synonyms}}}",variables:{s:v}})});
      if(r.ok){for(const m of (await r.json())?.data?.Page?.media||[]){
        if(m.coverImage?.large&&match(t,[m.title?.romaji,m.title?.english,m.title?.native,...(m.synonyms||[])].filter(Boolean)))return m.coverImage.large}}
      else err="AniList HTTP "+r.status;

      const r=await fetch("https://api.jikan.moe/v4/anime?limit=5&q="+encodeURIComponent(v));

    ["Avg session",f.length?dur(total/f.length):"–",`longest ${dur(longest)}`],["Busiest day",topDay?dur(topDay[1]):"–",topDay?topDay[0]:""],
    ["Peak hour",total?`${pad(pk)}:00`:"–",total?`most on ${wn[wk.indexOf(Math.max(...wk))]}`:""],
    ["Finished",known?Math.round(done/known*100)+"%":"–",known?`${done} of ${known} episodes`:"no progress data yet"],
    ["Library played",gb?gb.toFixed(1)+" GB":"–","unique files"]
  ].map(([k,v,s])=>`<div class="tile"><small>${k}</small><b>${v}</b><small>${s}</small></div>`).join("");

  // charts
  const dk=[],dv=[],dl=[],dt=[],t=new Date();
  const bmins=new Map();for(const s of sessions)if(base(s))bmins.set(s.day,(bmins.get(s.day)||0)+s.secs);
  for(let i=29;i>=0;i--){const x=new Date(t);x.setDate(t.getDate()-i);const k=iso(x),v=bmins.get(k)||0;
    dk.push(k);dv.push(v);dl.push(i%5===0?x.getDate():"");dt.push(`${k} · ${v?dur(v):"nothing"}`)}
  bars($("daily"),dv,dl,dt,dk,sel);
  bars($("hours"),hrs,hrs.map((_,i)=>i%6===0?i:""),hrs.map((v,i)=>`${pad(i)}:00 · ${dur(v)}`));
  bars($("wk"),wk,wn,wk.map((v,i)=>`${wn[i]} · ${dur(v)}`));
  const top=[...groups].sort((a,b)=>b.secs-a.secs).slice(0,6),mx=top[0]?.secs||1;
  $("top").innerHTML=top.map(a=>`<div class="row"><span>${esc(a.title)}</span><div class="track"><i style="width:${a.secs/mx*100}%"></i></div><b>${dur(a.secs)}</b></div>`).join("")||'<p class="mute">No data.</p>';

  // continue watching (ignores date filter)
  const pr=new Map();
  for(const s of sessions){
    if(!keep(s,min)||s.ep==null)continue;
    const v=(s.season??0)*1e4+s.ep;let p=pr.get(s.key);
    if(!p)pr.set(s.key,p={v:-1,last:"",title:s.title});
    if(s.opened>p.last)p.last=s.opened;
    if(v>p.v)Object.assign(p,{v,season:s.season,ep:s.ep,pct:s.pct});else if(v===p.v&&s.pct!=null)p.pct=Math.max(p.pct??0,s.pct);
  }
  const contRows=[...pr].filter(([k,p])=>{
    const ed=EDITS.shows[k]||{},T=totalOf(k),resume=p.pct!=null&&p.pct<85;
    return !(ed.status==="completed"||ed.status==="dropped"||(!resume&&T!=null&&p.ep>=T));
  }).sort((a,b)=>b[1].last.localeCompare(a[1].last)).slice(0,10);
  $("cont").innerHTML=contRows.map(([k,p])=>{
    const T=totalOf(k),resume=p.pct!=null&&p.pct<85;
    return `<div class="tile cont" data-id="${esc("s:"+k)}">${cov(k,p.title)}<div><b>${esc(p.title)}</b><small>last ${p.last.slice(0,10)}</small><br>`
      +`<span class="next">${resume?"Resume ":"Next "}${lab(p.season,resume?p.ep:p.ep+1)}${T?` of ${T}`:""}</span></div></div>`;
  }).join("")||'<p class="mute">Nothing to continue.</p>';

  // finished episodes per show (ignores filters), used for "x of N" progress
  FIN=new Map();
  for(const s of sessions){
    if(s.ep==null||s.pct==null||s.pct<85)continue;
    let f=FIN.get(s.key);if(!f)FIN.set(s.key,f=new Set());f.add((s.season??0)+":"+s.ep);
  }
  for(const k in EDITS.shows)for(const id of manualOf(k)){let f=FIN.get(k);if(!f)FIN.set(k,f=new Set());f.add(id)}

  // library
  $("list").classList.toggle("anim",first===true);
  $("list").innerHTML=groups.length?groups.map((a,i)=>{
    const ks=[...a.eps.values()].filter(e=>e.pct!=null),dn=ks.filter(e=>e.pct>=85).length;
    const ed=EDITS.shows[a.key]||{},T=tab==="movies"?null:totalOf(a.key),fd=FIN.get(a.key)?.size||0;
    const bar=T?Math.min(100,Math.round(fd/T*100)):ks.length?Math.round(dn/ks.length*100):null;
    return `<article class="poster" data-id="${esc(a.id)}" style="--i:${Math.min(i,14)}">${cov(a.key,a.title)}`
      +`<span class="badge">${tab==="movies"?(ks.length?Math.round(Math.max(...ks.map(e=>e.pct)))+"%":"movie"):T?`${fd}/${T}`:`${a.eps.size} ep${a.eps.size>1?"s":""}`}</span>`
      +(ed.status?`<span class="st">${esc(STATUS[ed.status]||ed.status)}</span>`:"")
      +`<div class="ov"><b>${esc(a.title)}</b><small>${dur(a.secs)} · ${a.last.slice(0,10)}${ed.rating?` · ★ ${esc(ed.rating)}`:""}</small>`
      +(T?`<small>${fd} of ${T} finished${fd<T?` · ${T-fd} left`:" · complete"}</small>`:"")
      +(bar!=null?`<div class="prog"><i style="width:${bar}%"></i></div>`:"")+"</div></article>";
  }).join(""):'<p class="empty mute">Nothing matches these filters.</p>';
  const tNow=tab;
  whyFn=s=>!inTab(s)?"in the "+(tNow==="movies"?"Series":"Movies")+" tab":!keep(s,min)?"hidden: short open":!base(s)?"hidden: search/progress":((from&&s.day<from)||(to&&s.day>to))?"hidden: date range":"shown";
  covers$($("app"));
}

$("dbody").addEventListener("click",async e=>{
  const id=e.target.id;
  if(id!=="e_save"&&id!=="e_done"&&id!=="e_reset"&&id!=="e_fill")return;
  const a=G.get(drawerId);if(!a)return;
  const key=a.key;let ed={...(EDITS.shows[key]||{})};
  if(id==="e_reset")ed={};
  else if(id==="e_save"){
    const v=n=>$(n)?$(n).value.trim():"";
    const title=v("e_title"),total=Math.round(+v("e_total")),rating=+v("e_rating"),poster=v("e_poster"),mday=v("e_mday"),mmin=+v("e_mmin"),mmb=+v("e_mmb");
    let man={};
    try{man=textToManual($("e_manual")?$("e_manual").value:"",defSeason(key))}catch(err){showErr(err.message||String(err));return}
    ed={};
    if(title&&title!==a.title0)ed.title=title;
    if(total>0)ed.total=total;
    if(v("e_status"))ed.status=v("e_status");
    if(v("e_kind"))ed.kind=v("e_kind");
    if(/^\d{4}-\d{2}-\d{2}$/.test(mday))ed.mday=mday;
    if(mmin>0)ed.mmin=mmin;
    if(mmb>0)ed.mmb=mmb;
    if(rating>0&&rating<=10)ed.rating=rating;
    if(/^https?:\/\//i.test(poster))ed.poster=poster;
    if(v("e_notes"))ed.notes=v("e_notes");
    if(Object.keys(man).length)ed.manual=man;
  }else if(id==="e_fill"){ // mark every missing episode as watched outside mpv
    const miss=missingOf(key);let n=0;for(const x of miss.values())n+=x.length;
    if(!n)return;
    if(n>50&&!confirm(`Mark ${n} episodes as watched outside mpv?`))return;
    const cur={...(ed.manual||{})};
    for(const [sn,arr] of miss)cur[sn]=[...new Set([...(cur[sn]||[]),...arr])].sort((p,q)=>p-q);
    ed.manual=cur;
  }else{ // mark completed: total = highest episode seen (unless you already set one)
    let hi=0;for(const s of sessions)if(s.key===key&&s.ep!=null&&s.ep>hi)hi=s.ep;
    for(const m of manualOf(key)){const en=+m.split(":")[1];if(en>hi)hi=en}
    if(!ed.total&&hi)ed.total=hi;
    ed.status="completed";
  }
  if(Object.keys(ed).length)EDITS.shows[key]=ed;else delete EDITS.shows[key];
  if(await saveEdits())openShow(drawerId);
});

// Episodes marked as watched outside mpv can count in the time stats and calendar (switch "manual in stats").
// Needs a date on the show. Time per episode = median runtime of its real episodes, size = their average,
// unless you filled in minutes / MB on the show.
let manualOn=false;try{manualOn=localStorage.getItem("mpvloger.manual")==="1"}catch{}
function guess(list,key){
  const durs=[],szs=[],seen=new Set();
  for(const s of list)if(s.key===key&&s.ep!=null&&!s.manual){
    if(s.dur)durs.push(s.dur);else if(s.pct!=null&&s.pct>=85&&s.watched)durs.push(s.watched);
    if(s.size>0&&!seen.has(s.name)){seen.add(s.name);szs.push(s.size)}
  }
  let secs=null;
  if(durs.length){durs.sort((x,y)=>x-y);const m=durs.length>>1;secs=durs.length%2?durs[m]:(durs[m-1]+durs[m])/2}
  return {secs,size:szs.length?szs.reduce((x,y)=>x+y,0)/szs.length:null};
}
function addManual(list){
  const real=new Set(),raw=list.slice();
  for(const s of raw)if(s.ep!=null)real.add(s.key+"|"+(s.season??0)+":"+s.ep);
  for(const key in EDITS.shows){
    const ed=EDITS.shows[key];
    if(!ed.manual||!/^\d{4}-\d{2}-\d{2}$/.test(ed.mday||""))continue;
    const base=raw.find(s=>s.key===key&&s.ep!=null);if(!base)continue;
    const g=guess(raw,key),secs=ed.mmin>0?ed.mmin*60:g.secs,size=ed.mmb>0?ed.mmb*1048576:(g.size||0);
    let n=0;
    for(const sn in ed.manual)for(const ep of ed.manual[sn]){
      if(real.has(key+"|"+sn+":"+ep))continue;
      const om=Date.parse(ed.mday+"T12:00:00")+(n++)*1000;
      const x={...base,name:"[manual] "+base.title0+" E"+ep,folder:"",season:+sn||null,ep,opened:ed.mday+"T12:00:00",closed:ed.mday+"T12:00:00",
        om,cm:om+(secs||0)*1000,wall:secs||0,watched:secs||0,dur:secs,day:ed.mday,pct:100,size,manual:true};
      x.secs=calc(x);list.push(x);
    }
  }
}

// Types: find out online whether a show is anime, a K-drama, etc. Nothing is sent until you press Send.
const SRC={anilist:"AniList",tvmaze:"TVmaze",tmdb:"TMDB"};
const TY={s:null,failed:false,prev:null,res:null,busy:false,msg:"",cancel:false};
const tyTitle=k=>{const x=sessions.find(v=>v.key===k);return EDITS.shows[k]?.title||(x&&x.title)||k};
async function tySend(path,method,body){
  const r=await fetch(path,{method,headers:{"Content-Type":"application/json","X-WH":"1"},body:body===undefined?undefined:JSON.stringify(body)});
  let d={};try{d=await r.json()}catch{}
  if(!r.ok)throw new Error(d.error||"HTTP "+r.status);
  return d;
}
async function tyLoad(){
  try{const r=await fetch("/api/types",{cache:"no-store"});if(!r.ok)throw new Error("HTTP "+r.status);TY.s=await r.json();TY.failed=false}
  catch(e){TY.failed=true;TY.msg="Could not load type settings: "+(e.message||e)}
  renderTypes();
}
// series with no type yet, not on the never list and not looked up before
function tyCands(){
  const done=new Set(TY.s.lookups.map(x=>x.key)),skip=new Set(TY.s.skip),seen=new Map();
  for(const s of sessions)if(s.ep!=null&&!seen.has(s.key)&&!EDITS.shows[s.key]?.kind&&!skip.has(s.key)&&!done.has(s.key)){
    const raw=s.title0||s.title,m=raw.match(/\((\d{4})\)/);
    seen.set(s.key,{key:s.key,title:raw.replace(/\s*\(\d{4}\)/g,"").trim(),year:m?+m[1]:null});
  }
  return [...seen.values()].filter(x=>x.title);
}

  let h="<h3>Types</h3><p class=\"mute\"><small>Finds anime, K-dramas and other types online. Nothing is sent until you press Find titles and then Send. Only the cleaned title and year are sent, never filenames, folders or watch data. Sources that are off are never contacted.</small></p>"
    +"<p>"+Object.keys(SRC).map(n=>`<label style="margin-right:14px"><input type="checkbox" data-src="${n}"${on[n]?" checked":""}${n==="tmdb"&&!S.tmdb_key_set?" disabled":""}> ${SRC[n]}</label>`).join("")+"</p>"

    h+=`<p><b>${TY.prev.length}</b> titles will be sent to: ${esc(used)}</p>`
      +TY.prev.map((x,i)=>`<label style="display:block"><input type="checkbox" data-pv="${i}" checked> ${esc(x.title)}${x.year?` (${x.year})`:""} <span class="mute">· <input type="checkbox" data-never="${i}"> never look up</span></label>`).join("")
      +`<p><button class="chip" data-ty="send">Send</button> <button class="chip" data-ty="cancel">Cancel</button></p>`;
  }else if(!TY.busy){
    h+=`<p><button class="chip" data-ty="find">Find titles to look up (${tyCands().length})</button> <button class="chip" data-ty="forget">Forget lookups (${S.lookups.length})</button>`
      +(S.skip.length?` <button class="chip" data-ty="unskip">Clear never-list (${S.skip.length})</button>`:"")+"</p>";
  }
  if(TY.busy)h+=`<p>${esc(TY.msg)} <button class="chip" data-ty="stop">Stop</button></p>`;
  else if(TY.msg)h+=`<p class="mute">${esc(TY.msg)}</p>`;
  if(TY.res&&TY.res.length){
    h+="<p><b>Results</b> <small class=\"mute\">(unsure matches are not ticked)</small></p>"
      +TY.res.map((r,i)=>r.kind==="unknown"
        ?`<div class="mute">${esc(tyTitle(r.key))}: no match</div>`
        :`<label style="display:block"><input type="checkbox" data-rs="${i}"${r.confident?" checked":""}> ${esc(tyTitle(r.key))} → <select data-rk="${i}">${Object.entries(KINDS).map(([v,l])=>`<option value="${v}"${r.kind===v?" selected":""}>${l}</option>`).join("")}</select> <span class="mute">matched “${esc(r.matched)}” via ${esc(SRC[r.source]||"")}${r.episodes?` · ${r.episodes} eps`:""}</span></label>`).join("")
      +`<p><button class="chip" data-ty="apply">Apply ticked</button></p>`;
  }
  box.innerHTML=h;
}
async function tyRun(items){
  TY.busy=true;TY.cancel=false;TY.res=[];TY.msg="";
  for(let i=0;i<items.length&&!TY.cancel;i+=10){
    TY.msg=`Looking up ${Math.min(i+10,items.length)} of ${items.length}…`;renderTypes();
    try{
      const d=await tySend("/api/types/detect","POST",{items:items.slice(i,i+10).map(({key,title,year})=>({key,title,year}))});
      TY.res.push(...d.results);
      if(d.errors.length){TY.msg=d.errors.join(" ");break}
    }catch(e){TY.msg="Lookup failed: "+(e.message||e);break}
  }
  TY.busy=false;
  if(!TY.msg||TY.msg.startsWith("Looking up"))TY.msg=TY.cancel?"Stopped.":`Done: ${TY.res.length} looked up.`;
  await tyLoad();
}
$("typesBox").addEventListener("change",async e=>{
  const t=e.target;
  try{
    if(t.dataset.src){TY.s=await tySend("/api/types/settings","PUT",{sources:{[t.dataset.src]:t.checked}});renderTypes()}
    else if(t.dataset.rk)TY.res[+t.dataset.rk].kind=t.value;
  }catch(err){TY.msg=err.message||String(err);renderTypes()}
});
$("typesBox").addEventListener("click",async e=>{
  const act=e.target.dataset&&e.target.dataset.ty;if(!act||!TY.s)return;
  const box=$("typesBox");
  try{
    if(act==="savekey"){
      const k=$("ty_key").value.trim();if(!k)return;
      TY.s=await tySend("/api/types/settings","PUT",{tmdb_key:k,sources:{tmdb:true}});TY.msg="Key saved.";renderTypes();
    }else if(act==="delkey"){TY.s=await tySend("/api/types/settings","PUT",{tmdb_key:""});TY.msg="Key removed.";renderTypes()}
    else if(act==="find"){TY.prev=tyCands();TY.res=null;TY.msg=TY.prev.length?"":"Nothing new to look up.";if(!TY.prev.length)TY.prev=null;renderTypes()}
    else if(act==="cancel"){TY.prev=null;renderTypes()}
    else if(act==="send"){
      const prev=TY.prev,never=new Set(),items=[];
      box.querySelectorAll("[data-never]:checked").forEach(c=>never.add(prev[+c.dataset.never].key));
      box.querySelectorAll("[data-pv]:checked").forEach(c=>{const x=prev[+c.dataset.pv];if(!never.has(x.key))items.push(x)});
      TY.prev=null;
      if(never.size)TY.s=await tySend("/api/types/settings","PUT",{skip:[...TY.s.skip,...never]});
      if(!items.length){TY.msg=never.size?"Saved the never-list.":"Nothing selected.";renderTypes();return}
      await tyRun(items);
    }else if(act==="stop")TY.cancel=true;
    else if(act==="forget"){if(confirm("Forget all saved lookups? Types you already applied stay.")){TY.s=await tySend("/api/types/forget","POST");TY.res=null;TY.msg="Lookups forgotten.";renderTypes()}}
    else if(act==="unskip"){TY.s=await tySend("/api/types/settings","PUT",{skip:[]});renderTypes()}
    else if(act==="apply"){
      let n=0;
      box.querySelectorAll("[data-rs]:checked").forEach(c=>{
        const r=TY.res[+c.dataset.rs],cur=EDITS.shows[r.key]||{};
        if(KINDS[r.kind]&&!cur.kind){const nx={...cur,kind:r.kind};if(!cur.total&&r.episodes>0)nx.total=r.episodes;EDITS.shows[r.key]=nx;n++}
      });
      if(n){TY.res=null;TY.msg=`Applied ${n} types.`;await saveEdits()}else{TY.msg="Nothing ticked.";renderTypes()}
    }
  }catch(err){TY.msg=err.message||String(err);renderTypes()}
});
{const base=renderInfo;renderInfo=function(){base();renderTypes()}}


// Suggest Completed (off by default): when the finished episodes reach a show's total, offer to mark it Completed.
// Never changes anything by itself. Dropped and already-completed shows are skipped; "Not now" is remembered
// for that show and total.
let autoOn=false,noAuto=new Set(),DONE=[];
try{autoOn=localStorage.getItem("mpvloger.auto")==="1";noAuto=new Set(JSON.parse(localStorage.getItem("mpvloger.noauto")||"[]"))}catch{}
function checkComplete(){
  const box=$("donenote");DONE=[];
  if(autoOn&&SERVER)for(const [key,fin] of FIN){
    const T=totalOf(key),st=EDITS.shows[key]?.status;
    if(T&&fin.size>=T&&st!=="completed"&&st!=="dropped"&&!noAuto.has(key+"|"+T))DONE.push({key,T});
  }
  if(!DONE.length){box.hidden=true;return}
  box.hidden=false;
  box.innerHTML=DONE.slice(0,5).map((d,i)=>`<div>${esc(tyTitle(d.key))} has all ${d.T} episodes finished. <button class="chip" data-done="${i}">Mark completed</button> <button class="chip" data-later="${i}">Not now</button></div>`).join("")
    +(DONE.length>5?`<div class="mute">…and ${DONE.length-5} more</div>`:"")
    +(DONE.length>1?`<div><button class="chip" data-doneall="1">Mark all ${DONE.length} completed</button></div>`:"");
}
$("donenote").addEventListener("click",async e=>{
  const d=e.target.dataset||{};
  if(d.later!==undefined){
    const x=DONE[+d.later];if(!x)return;
    noAuto.add(x.key+"|"+x.T);try{localStorage.setItem("mpvloger.noauto",JSON.stringify([...noAuto]))}catch{}
    checkComplete();return;
  }
  const list=d.done!==undefined?[DONE[+d.done]]:d.doneall?DONE.slice():[];
  if(!list.length||!list[0])return;
  for(const x of list)EDITS.shows[x.key]={...(EDITS.shows[x.key]||{}),status:"completed"};
  await saveEdits();
});
$("autotog").checked=autoOn;
$("autotog").onchange=()=>{autoOn=$("autotog").checked;try{localStorage.setItem("mpvloger.auto",autoOn?"1":"0")}catch{}checkComplete()};
{const base=view;view=function(first){base(first);checkComplete()}}

// Looks: the options of select#look decide what exists (see the LOOKS comment in the CSS).
// The choice is kept in the browser, and in the database when the server runs.
function saveLook(l){
  try{localStorage.setItem("mpvloger.look",l)}catch{}
  if(SERVER)fetch("/api/prefs",{method:"PUT",headers:{"Content-Type":"application/json","X-WH":"1"},body:JSON.stringify({look:l})}).catch(()=>{});
}
const lookSel=$("look");
{
  let cur=document.documentElement.dataset.look;
  if(![...lookSel.options].some(o=>o.value===cur)){cur="violet";applyLook(cur)}
  lookSel.value=cur;
  lookSel.onchange=()=>{applyLook(lookSel.value);saveLook(lookSel.value)};
}
async function syncLookFromServer(){
  const r=await fetch("/api/prefs",{cache:"no-store"});if(!r.ok)return;
  const d=await r.json();
  if(d&&[...lookSel.options].some(o=>o.value===d.look)){
    if(d.look!==lookSel.value){lookSel.value=d.look;applyLook(d.look);try{localStorage.setItem("mpvloger.look",d.look)}catch{}}
  }else if(lookSel.value!=="violet")saveLook(lookSel.value);
}

// Server mode: if this page is served by server.py, read the log live and enable editing.
async function post(path){
  const r=await fetch(path,{method:"POST",headers:{"X-WH":"1"}});
  let d={};try{d=await r.json()}catch{}
  if(!r.ok)throw new Error(d.error||"HTTP "+r.status);
  return d;
}
function dbNote(){
  const n=$("dbnote"),parts=[];
  if(SYNC.log_exists===false)parts.push("Log file not found ("+esc(SERVERINFO.log||"")+"); showing what is already in the database.");
  if(SYNC.notice)parts.push(esc(SYNC.notice)+" Existing history was kept. <button class=\"chip\" data-act=\"rebuild\">Rebuild from log</button>");
  n.hidden=!parts.length;n.innerHTML=parts.join("<br>");
}
// Sync the database with the log (only new lines are read), then fetch only the sessions we do not have yet.
async function loadFromServer(keep,rebuildDb){
  SYNC=await post(rebuildDb?"/api/rebuild":"/api/sync");
  const r=await fetch("/api/sessions?after="+DBLAST+"&epoch="+(DBEPOCH||""),{cache:"no-store"});
  if(!r.ok){let m="";try{m=(await r.json()).error}catch{}throw new Error(m||"HTTP "+r.status)}
  const d=await r.json();
  DBROWS=(d.reset||DBEPOCH===null)?d.rows:DBROWS.concat(d.rows);
  DBLAST=d.last_id;DBEPOCH=d.epoch;
  const text=DBROWS.map(x=>JSON.stringify(x)).join("\n");
  await load({name:"history.db",text:async()=>text},keep);
  dbNote();
}
document.addEventListener("click",async e=>{
  const b=e.target.closest&&e.target.closest("[data-act=rebuild]");if(!b)return;
  if(!confirm("Rebuild the sessions from the log file?\nSessions that are no longer in the log will be removed from the database. Your edits are kept."))return;
  try{await loadFromServer(true,true)}catch(err){showErr("Could not rebuild: "+(err.message||err))}
});
$("refresh").onclick=()=>loadFromServer(true).catch(e=>showErr("Could not read the log: "+(e.message||e)));
(async()=>{
  if(!/^https?:$/.test(location.protocol))return;
  try{
    const r=await fetch("/api/info",{cache:"no-store"});
    if(!r.ok)return;
    const info=await r.json();
    if(!info||info.server!==true)return;
    SERVER=true;SERVERINFO=info;
    const e=await fetch("/api/edits",{cache:"no-store"});
    if(e.ok){const d=await e.json();if(d&&d.shows)EDITS=d}
    try{await syncLookFromServer()}catch{}
    $("drop").style.display="none";$("refresh").hidden=false;
    await loadFromServer(false);
  }catch(e){if(SERVER)showErr("Could not read the log: "+(e.message||e))}
})();
